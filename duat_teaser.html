<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>DUAT Teaser</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@500;600&display=swap"
    rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      background-color: #000000;
      overflow: hidden;
      cursor: none;
      user-select: none;
      -webkit-user-select: none;
    }

    /* 1080x1920 Stage centered and scaled to viewport */
    #stage {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 1080px;
      height: 1920px;
      transform: translate(-50%, -50%) scale(var(--scale, 1));
      transform-origin: center center;
      background-color: #0A0C16;
      overflow: hidden;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    #stage.ready {
      opacity: 1;
    }

    /* Bottom Warm Glow */
    #bg-glow {
      position: absolute;
      top: 0;
      left: 0;
      width: 1080px;
      height: 1920px;
      pointer-events: none;
      background: radial-gradient(circle 650px at 50% 100%,
          rgba(232, 163, 61, var(--glow-op1, 0.1)) 0%,
          rgba(201, 123, 34, var(--glow-op2, 0.05)) 45%,
          transparent 100%);
      z-index: 1;
    }

    /* Film Grain Overlay */
    #grain-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 1080px;
      height: 1920px;
      pointer-events: none;
      opacity: 0.055;
      z-index: 10;
    }

    /* Scene 1: Hook Text */
    #hook-text {
      position: absolute;
      top: 320px;
      left: 0;
      width: 1080px;
      text-align: center;
      direction: rtl;
      color: #EDE4D3;
      font-family: 'IBM Plex Sans Arabic', sans-serif;
      font-weight: 600;
      font-size: 42px;
      line-height: 1.6;
      pointer-events: none;
      z-index: 4;
      opacity: 0;
      transform: translateY(14px);
    }

    /* Sun Halo Bloom */
    #sun-halo {
      position: absolute;
      top: 852.5px;
      left: 300px;
      width: 480px;
      height: 480px;
      border-radius: 50%;
      background: radial-gradient(circle,
          rgba(232, 163, 61, 0.45) 0%,
          rgba(201, 123, 34, 0.2) 45%,
          transparent 75%);
      pointer-events: none;
      z-index: 2;
      transform-origin: center center;
      opacity: 0;
      transform: scale(0.9);
    }

    /* Sun Clipped Container (everything below HORIZON_Y = 1152px is clipped) */
    #sun-clip-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 1080px;
      height: 1920px;
      pointer-events: none;
      z-index: 3;
      clip-path: inset(0 0 768px 0);
      /* 1920 - 1152 = 768px */
    }

    /* Sun Disc */
    #sun-disc {
      position: absolute;
      top: 1172px;
      /* starts fully below horizon line */
      left: 421px;
      /* (1080 - 238)/2 */
      width: 238px;
      height: 238px;
      border-radius: 50%;
      background-color: #E8A33D;
      pointer-events: none;
    }

    /* Horizon Line */
    #horizon-line {
      position: absolute;
      top: 1146px;
      /* center at HORIZON_Y = 1152px */
      left: 130px;
      /* 12% margin */
      width: 820px;
      /* 76% width */
      height: 12px;
      /* ~0.6% height */
      background-color: #EDE4D3;
      border-radius: 6px;
      transform-origin: center center;
      transform: scaleX(0);
      pointer-events: none;
      z-index: 5;
    }

    /* Scene 5: Sign-off Block */
    #signoff-container {
      position: absolute;
      top: 1290px;
      left: 0;
      width: 1080px;
      text-align: center;
      color: #EDE4D3;
      font-family: 'IBM Plex Sans Arabic', sans-serif;
      pointer-events: none;
      z-index: 4;
      opacity: 0;
      transform: translateY(10px);
    }

    .wordmark {
      font-weight: 600;
      font-size: 86px;
      letter-spacing: 0.35em;
      text-indent: 0.35em;
      color: #EDE4D3;
      margin-bottom: 20px;
      text-transform: uppercase;
      line-height: 1;
    }

    .handle {
      font-weight: 500;
      font-size: 38px;
      letter-spacing: 0.15em;
      text-indent: 0.15em;
      color: #EDE4D3;
      opacity: 0.7;
      margin-bottom: 28px;
      line-height: 1;
    }

    .slogan {
      font-weight: 500;
      font-size: 34px;
      color: #EDE4D3;
      opacity: 0.6;
      direction: rtl;
      line-height: 1;
    }
  </style>
</head>

<body>

  <div id="stage">
    <!-- Bottom warm glow gradient -->
    <div id="bg-glow"></div>

    <!-- Scene 1: Hook text -->
    <div id="hook-text">
      <div>كل ليلة الشمس بتموت.</div>
      <div>وكل فجر بتطلع تاني.</div>
    </div>

    <!-- Scene 3: Sun Halo & Disc -->
    <div id="sun-halo"></div>
    <div id="sun-clip-container">
      <div id="sun-disc"></div>
    </div>

    <!-- Scene 2: Horizon line -->
    <div id="horizon-line"></div>

    <!-- Scene 5: Sign-off wordmark & text -->
    <div id="signoff-container">
      <div class="wordmark">DUAT</div>
      <div class="handle">@wearduat</div>
      <div class="slogan">الفجر جاي</div>
    </div>

    <!-- Film Grain Canvas Overlay -->
    <canvas id="grain-canvas" width="1080" height="1920"></canvas>
  </div>

  <script>
    // --------------------------------------------------
    // VIEWPORT AUTO-SCALE & LETTERBOXING
    // --------------------------------------------------
    function updateScale() {
      const w = window.innerWidth;
      const h = window.innerHeight;
      const scale = Math.min(w / 1080, h / 1920);
      document.documentElement.style.setProperty('--scale', scale);
    }
    window.addEventListener('resize', updateScale);
    updateScale();

    // --------------------------------------------------
    // DOM ELEMENTS
    // --------------------------------------------------
    const stage = document.getElementById('stage');
    const bgGlow = document.getElementById('bg-glow');
    const hookText = document.getElementById('hook-text');
    const sunHalo = document.getElementById('sun-halo');
    const sunDisc = document.getElementById('sun-disc');
    const horizonLine = document.getElementById('horizon-line');
    const signoffContainer = document.getElementById('signoff-container');
    const grainCanvas = document.getElementById('grain-canvas');
    const grainCtx = grainCanvas.getContext('2d');

    // --------------------------------------------------
    // PRE-RENDERED FILM GRAIN NOISE PATTERNS
    // --------------------------------------------------
    const noiseTiles = [];
    const TILE_SIZE = 512;
    for (let t = 0; t < 4; t++) {
      const canvas = document.createElement('canvas');
      canvas.width = TILE_SIZE;
      canvas.height = TILE_SIZE;
      const ctx = canvas.getContext('2d');
      const imgData = ctx.createImageData(TILE_SIZE, TILE_SIZE);
      const data = imgData.data;
      for (let i = 0; i < data.length; i += 4) {
        const v = Math.floor(Math.random() * 255);
        data[i] = v;
        data[i + 1] = v;
        data[i + 2] = v;
        data[i + 3] = Math.floor(Math.random() * 80 + 30);
      }
      ctx.putImageData(imgData, 0, 0);
      noiseTiles.push(canvas);
    }

    let frameCount = 0;
    function drawFilmGrain() {
      frameCount++;
      grainCtx.clearRect(0, 0, 1080, 1920);
      const pattern = grainCtx.createPattern(noiseTiles[frameCount % 4], 'repeat');
      grainCtx.fillStyle = pattern;
      grainCtx.save();
      // Shift pattern slightly per frame for living grain feel
      const offsetX = (frameCount * 17) % TILE_SIZE;
      const offsetY = (frameCount * 23) % TILE_SIZE;
      grainCtx.translate(-offsetX, -offsetY);
      grainCtx.fillRect(0, 0, 1080 + TILE_SIZE, 1920 + TILE_SIZE);
      grainCtx.restore();
    }

    // --------------------------------------------------
    // EASING HELPERS
    // --------------------------------------------------
    function easeOutExpo(x) {
      return x === 1 ? 1 : 1 - Math.pow(2, -10 * x);
    }

    function easeOutCubic(x) {
      return 1 - Math.pow(1 - x, 3);
    }

    function clamp(val, min, max) {
      return Math.min(Math.max(val, min), max);
    }

    // --------------------------------------------------
    // MASTER TIMELINE ENGINE
    // Driven by requestAnimationFrame & elapsed ms
    // --------------------------------------------------
    let startTime = null;
    const HORIZON_Y = 1152; // 60% of 1920
    const SUN_TOP_START = 1172; // fully clipped below HORIZON_Y
    const SUN_TOP_END = 973.5;  // center at 1092.5px (bottom 25% crossed by horizon)

    function render(now) {
      if (!startTime) startTime = now;
      const elapsed = now - startTime;

      // Render grain continuously
      drawFilmGrain();

      // Cap master clock at 7000ms for timeline, so it holds on final frame
      const ms = Math.min(elapsed, 7000);

      // ------------------------------------------------
      // 1. BOTTOM WARM GLOW
      // ------------------------------------------------
      let glowOp = 0.10;
      if (ms < 2000) {
        // Scene 1: Gentle breath 8% -> 15% on ~2.5s cycle
        const cycle = (ms % 2500) / 2500;
        const breath = (Math.sin(cycle * Math.PI * 2 - Math.PI / 2) + 1) / 2;
        glowOp = 0.08 + 0.07 * breath;
      } else if (ms >= 2000 && ms < 3200) {
        // Scene 2: Intensifies 15% -> 30% over 1.2s
        const p = easeOutCubic((ms - 2000) / 1200);
        glowOp = 0.15 + 0.15 * p;
      } else if (ms >= 3200 && ms < 3500) {
        glowOp = 0.30;
      } else if (ms >= 3500 && ms < 5100) {
        // Scene 3: Blooms 30% -> 42% over 1.6s
        const p = easeOutExpo((ms - 3500) / 1600);
        glowOp = 0.30 + 0.12 * p;
      } else {
        // Scene 4 & 5: Holds steady at 42%
        glowOp = 0.42;
      }
      bgGlow.style.setProperty('--glow-op1', glowOp.toFixed(4));
      bgGlow.style.setProperty('--glow-op2', (glowOp * 0.55).toFixed(4));

      // ------------------------------------------------
      // 2. SCENE 1: HOOK TEXT
      // ------------------------------------------------
      let hookOp = 0;
      let hookTY = 14;
      if (ms >= 300 && ms < 1100) {
        // Fade in 0.3s -> 1.1s (translateY 14px -> 0)
        const p = easeOutCubic((ms - 300) / 800);
        hookOp = p;
        hookTY = 14 * (1 - p);
      } else if (ms >= 1100 && ms < 2000) {
        hookOp = 1;
        hookTY = 0;
      } else if (ms >= 2000 && ms < 2500) {
        // Fade out 2.0s -> 2.5s (translateY 0 -> -14px)
        const p = easeOutCubic((ms - 2000) / 500);
        hookOp = 1 - p;
        hookTY = -14 * p;
      } else if (ms >= 2500) {
        hookOp = 0;
      }
      hookText.style.opacity = hookOp;
      hookText.style.transform = `translateY(${hookTY.toFixed(2)}px)`;

      // ------------------------------------------------
      // 3. SCENE 2: HORIZON LINE REVEAL
      // ------------------------------------------------
      let lineScaleX = 0;
      if (ms >= 2100 && ms < 3100) {
        const p = easeOutExpo((ms - 2100) / 1000);
        lineScaleX = p;
      } else if (ms >= 3100) {
        lineScaleX = 1;
      }
      horizonLine.style.transform = `scaleX(${lineScaleX.toFixed(4)})`;

      // ------------------------------------------------
      // 4. SCENE 3 & 4: SUN DISC & HALO BLOOM
      // ------------------------------------------------
      let sunTop = SUN_TOP_START;
      let haloOp = 0;
      let haloScale = 0.9;

      if (ms >= 3500 && ms < 5100) {
        // Rises 3.5s -> 5.1s (1.6s ease-out-expo)
        const p = easeOutExpo((ms - 3500) / 1600);
        sunTop = SUN_TOP_START - (SUN_TOP_START - SUN_TOP_END) * p;
        haloOp = 0.45 * p;
        haloScale = 0.9 + 0.1 * p;
      } else if (ms >= 5100 && ms < 5300) {
        sunTop = SUN_TOP_END;
        haloOp = 0.45;
        haloScale = 1.0;
      } else if (ms >= 5300 && ms < 5800) {
        // Scene 4: Settle breath (scale up ~3% and back over 0.5s)
        sunTop = SUN_TOP_END;
        const p = (ms - 5300) / 500;
        const breath = Math.sin(p * Math.PI);
        haloScale = 1.0 + 0.03 * breath;
        haloOp = 0.45 + 0.05 * breath;
      } else if (ms >= 5800) {
        sunTop = SUN_TOP_END;
        haloOp = 0.45;
        haloScale = 1.0;
      }

      sunDisc.style.top = `${sunTop.toFixed(2)}px`;
      sunHalo.style.opacity = haloOp;
      sunHalo.style.transform = `scale(${haloScale.toFixed(4)})`;

      // ------------------------------------------------
      // 5. SCENE 5: SIGN-OFF TEXT
      // ------------------------------------------------
      let signOp = 0;
      let signTY = 10;
      if (ms >= 6000 && ms < 6600) {
        const p = easeOutCubic((ms - 6000) / 600);
        signOp = p;
        signTY = 10 * (1 - p);
      } else if (ms >= 6600) {
        signOp = 1;
        signTY = 0;
      }
      signoffContainer.style.opacity = signOp;
      signoffContainer.style.transform = `translateY(${signTY.toFixed(2)}px)`;

      // Loop animation frame (runs continuously for grain)
      requestAnimationFrame(render);
    }

    // --------------------------------------------------
    // INIT & FONT LOADING API
    // --------------------------------------------------
    document.fonts.ready.then(() => {
      // 300ms pre-start delay for clean font render
      setTimeout(() => {
        stage.classList.add('ready');
        requestAnimationFrame(render);
      }, 300);
    });
  </script>
</body>

</html>
